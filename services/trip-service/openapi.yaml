openapi: 3.0.0
info:
  title: Trip Service API
  description: |
    AI-Powered Timeline Travel Planning and Assistance Platform
    
    The Trip Service is the central hub for managing the complete travel timeline experience.
    It operates on a hierarchical node structure where top-level nodes represent regions 
    (cities/towns like "Colombo") that expand into rich sub-nodes covering all aspects 
    of travel in that region.
    
    **Core Model**: Region Nodes with 9 Sub-Node Categories
    - Transport: Multiple trip entries to/from the region
    - Hotel: Available hotels, bookings, and occupancy
    - Possible Visitable Locations: Browse all attractions; AI recommendations
    - Selected Visitable Locations: Attractions user plans to visit (auto-populated from transport or manual)
    - Activities: Regional experiences; typically admin/external-API managed
    - Food & Dining: Restaurants, cafes, local food shops
    - Emergency Services: Hospitals, emergency contacts, medical facilities
    - Offers & Discounts: Regional promotions and deals
    - Cultural Context: Regional cultural info + dynamic tips for selected locations
    
    **Data Flow**: All enrichment (hotel availability, recommendations, cultural notes) 
    flows through Trip Service before reaching users. External data integrations happen 
    at the service layer, not at API boundaries.
    
    **Note**: Trip Service handles persistence and orchestration. Recommendation engines, 
    routing optimization, and disruption propagation are delegated to specialized agents 
    that call these APIs and perform business logic.
  version: 2.0.0
  contact:
    name: Team Egress
    email: team-egress@travel-platform.local

servers:
  - url: http://localhost:8002/api/v1
    description: Local development
  - url: https://api.travel-platform.local/trip-service/v1
    description: Production

tags:
  - name: Trips
    description: Trip creation, retrieval, and management
  - name: Region Nodes
    description: Top-level region nodes (cities/towns) in the timeline
  - name: Transport Sub-Node
    description: Transport trips to/from regions (flights, trains, buses, etc.)
  - name: Hotel Sub-Node
    description: Hotel search, booking, and occupancy for regions
  - name: Visitable Locations
    description: Browse possible attractions and manage selected locations
  - name: Activities Sub-Node
    description: Regional activities and experiences
  - name: Food & Dining Sub-Node
    description: Restaurants, cafes, and dining reservations
  - name: Emergency Services Sub-Node
    description: Hospitals, medical facilities, and emergency contacts
  - name: Offers & Discounts Sub-Node
    description: Regional promotions and discounts
  - name: Cultural Context Sub-Node
    description: Regional cultural guidance and location-specific etiquette
  - name: Trip Alerts
    description: Disruptions, delays, and alerts affecting trips

paths:
  # ===== TRIP MANAGEMENT =====
  /trips:
    post:
      tags:
        - Trips
      summary: Create a new trip
      operationId: create_trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '400':
          description: Invalid request

    get:
      tags:
        - Trips
      summary: List all trips for the authenticated user
      operationId: list_trips
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [planning, active, completed, cancelled]
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TripResponse'
                  total:
                    type: integer

  /trips/{trip_id}:
    get:
      tags:
        - Trips
      summary: Retrieve a trip by ID
      operationId: get_trip
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip details with timeline summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '404':
          description: Trip not found

    patch:
      tags:
        - Trips
      summary: Update trip metadata
      operationId: update_trip
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdateRequest'
      responses:
        '200':
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

    delete:
      tags:
        - Trips
      summary: Cancel a trip
      operationId: delete_trip
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Trip deleted

  # ===== REGION NODES (MAIN TIMELINE) =====
  /trips/{trip_id}/timeline:
    get:
      tags:
        - Region Nodes
      summary: Get the complete timeline (all region nodes ordered chronologically)
      operationId: get_timeline
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Timeline with all region nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id:
                    type: string
                    format: uuid
                  regions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegionNodeResponse'
                  summary:
                    type: object
                    properties:
                      total_regions:
                        type: integer
                      duration_days:
                        type: integer
                      total_budget:
                        type: number

  /trips/{trip_id}/timeline/regions:
    post:
      tags:
        - Region Nodes
      summary: Add a region (city/town) to the trip timeline
      operationId: create_region_node
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionNodeCreateRequest'
      responses:
        '201':
          description: Region node created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionNodeResponse'
        '400':
          description: Invalid region data

  /trips/{trip_id}/timeline/regions/{region_node_id}:
    get:
      tags:
        - Region Nodes
      summary: Get a region node with all sub-node summaries
      operationId: get_region_node
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Region node with all sub-nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionNodeDetailResponse'

    patch:
      tags:
        - Region Nodes
      summary: Update region node metadata (dates, notes)
      operationId: update_region_node
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionNodeUpdateRequest'
      responses:
        '200':
          description: Region node updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionNodeResponse'

    delete:
      tags:
        - Region Nodes
      summary: Delete a region from the timeline
      operationId: delete_region_node
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Region deleted

  # ===== TRANSPORT SUB-NODE =====
  /trips/{trip_id}/timeline/regions/{region_node_id}/transport:
    get:
      tags:
        - Transport Sub-Node
      summary: Get transport sub-node with all trips
      operationId: get_transport_subnode
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transport sub-node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportSubNodeResponse'

  /trips/{trip_id}/timeline/regions/{region_node_id}/transport/trips:
    post:
      tags:
        - Transport Sub-Node
      summary: Add a transport trip (1-way or round-trip) to the region
      operationId: add_transport_trip
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransportTripCreateRequest'
      responses:
        '201':
          description: Transport trip added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportTripResponse'

    get:
      tags:
        - Transport Sub-Node
      summary: List all transport trips for this region
      operationId: list_transport_trips
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of transport trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransportTripResponse'

  /trips/{trip_id}/timeline/regions/{region_node_id}/transport/trips/{trip_leg_id}:
    patch:
      tags:
        - Transport Sub-Node
      summary: Update a transport trip
      operationId: update_transport_trip
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: trip_leg_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransportTripUpdateRequest'
      responses:
        '200':
          description: Transport trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportTripResponse'

    delete:
      tags:
        - Transport Sub-Node
      summary: Delete a transport trip
      operationId: delete_transport_trip
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: trip_leg_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Transport trip deleted

  # ===== HOTEL SUB-NODE =====
  /trips/{trip_id}/timeline/regions/{region_node_id}/hotel:
    get:
      tags:
        - Hotel Sub-Node
      summary: Get hotel sub-node for the region
      operationId: get_hotel_subnode
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hotel sub-node with available hotels and booking status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelSubNodeResponse'

  /trips/{trip_id}/timeline/regions/{region_node_id}/hotel/search:
    post:
      tags:
        - Hotel Sub-Node
      summary: Search for available hotels in the region
      operationId: search_hotels
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelSearchRequest'
      responses:
        '200':
          description: List of available hotels
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotels:
                    type: array
                    items:
                      $ref: '#/components/schemas/HotelListing'
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        hotel_id:
                          type: string
                        reason:
                          type: string
                          description: Why this hotel is recommended for this user

  /trips/{trip_id}/timeline/regions/{region_node_id}/hotel/book:
    post:
      tags:
        - Hotel Sub-Node
      summary: Book a hotel for the region
      operationId: book_hotel
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelBookingRequest'
      responses:
        '201':
          description: Hotel booked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelBookingResponse'

  # ===== VISITABLE LOCATIONS =====
  /trips/{trip_id}/timeline/regions/{region_node_id}/locations/possible:
    get:
      tags:
        - Visitable Locations
      summary: Get all possible visitable locations (attractions) in the region
      operationId: get_possible_locations
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            type: string
            enum: [cultural, historical, adventure, relaxation, food, nature, religious]
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of possible locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  locations:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitableLocationResponse'
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        location_id:
                          type: string
                        match_score:
                          type: number
                          format: double
                          description: 0-1 score based on user preferences

    post:
      tags:
        - Visitable Locations
      summary: Create a new visitable location in the region (admin)
      operationId: create_visitable_location
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitableLocationCreateRequest'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitableLocationResponse'

  /trips/{trip_id}/timeline/regions/{region_node_id}/locations/possible/{location_id}:
    patch:
      tags:
        - Visitable Locations
      summary: Update a visitable location (admin)
      operationId: update_visitable_location
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: location_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitableLocationUpdateRequest'
      responses:
        '200':
          description: Location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitableLocationResponse'

    delete:
      tags:
        - Visitable Locations
      summary: Delete a visitable location (admin)
      operationId: delete_visitable_location
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: location_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Location deleted
    get:
      tags:
        - Visitable Locations
      summary: Get selected (planned) visitable locations for the region
      operationId: get_selected_locations
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of selected locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SelectedLocationResponse'

    post:
      tags:
        - Visitable Locations
      summary: Add a location to selected locations
      operationId: add_selected_location
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                location_id:
                  type: string
                  description: ID of location to add
                visit_date:
                  type: string
                  format: date
                visit_time:
                  type: string
                  description: Preferred visit time (e.g., morning, afternoon)
              required:
                - location_id
      responses:
        '201':
          description: Location added to selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectedLocationResponse'

  /trips/{trip_id}/timeline/regions/{region_node_id}/locations/selected/{location_id}:
    delete:
      tags:
        - Visitable Locations
      summary: Remove a location from selected locations
      operationId: remove_selected_location
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: location_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Location removed

  # ===== ACTIVITIES SUB-NODE =====
  /trips/{trip_id}/timeline/regions/{region_node_id}/activities:
    get:
      tags:
        - Activities Sub-Node
      summary: Get activities available in the region
      operationId: get_activities
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [easy, moderate, difficult]
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'

    post:
      tags:
        - Activities Sub-Node
      summary: Create a new activity for the region (admin)
      operationId: create_activity
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
      responses:
        '201':
          description: Activity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'

  /trips/{trip_id}/timeline/regions/{region_node_id}/activities/{activity_id}:
    patch:
      tags:
        - Activities Sub-Node
      summary: Update an activity (admin)
      operationId: update_activity
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityUpdateRequest'
      responses:
        '200':
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'

    delete:
      tags:
        - Activities Sub-Node
      summary: Delete an activity (admin)
      operationId: delete_activity
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Activity deleted

  # ===== FOOD & DINING SUB-NODE =====
  /trips/{trip_id}/timeline/regions/{region_node_id}/dining:
    get:
      tags:
        - Food & Dining Sub-Node
      summary: Get restaurants and food shops in the region
      operationId: get_dining_options
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cuisine
          in: query
          schema:
            type: string
        - name: dietary_filter
          in: query
          schema:
            type: string
            enum: [vegetarian, vegan, halal, kosher, gluten_free]
      responses:
        '200':
          description: List of dining options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiningOptionResponse'

    post:
      tags:
        - Food & Dining Sub-Node
      summary: Add a new dining option to the region (admin)
      operationId: create_dining_option
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiningOptionCreateRequest'
      responses:
        '201':
          description: Dining option created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiningOptionResponse'

  /trips/{trip_id}/timeline/regions/{region_node_id}/dining/{dining_option_id}:
    patch:
      tags:
        - Food & Dining Sub-Node
      summary: Update a dining option (admin)
      operationId: update_dining_option
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: region_node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dining_option_id
          in: path
          required: true
          schema:
            type: string
