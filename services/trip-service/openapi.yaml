          type: string
        alert_type:
          type: string
        severity:
          type: string
        affected_region_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, resolved, acknowledged]
        delay_minutes:
          type: integer
        source:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TripAlertDetailedResponse:
      allOf:
        - $ref: '#/components/schemas/TripAlertResponse'
        - type: object
          properties:
            affected_region:
              $ref: '#/components/schemas/RegionNodeResponse'
            downstream_impacts:
              type: array
              items:
                type: object
                properties:
                  affected_region_id:
                    type: string
                    format: uuid
                  region_name:
                    type: string
                  impact_description:
                    type: string
                  potential_issues:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [booking_conflict, check_in_miss, transport_miss, reservation_invalid]
                        description:
                          type: string
                        affected_item:
                          type: string
            resolution_notes:
              type: string

    DisruptionPropagationResponse:
      type: object
      properties:
        alert_id:
          type: string
          format: uuid
        primary_affected_region:
          type: string
        propagation_analysis:
          type: array
          items:
            type: object
            properties:
              region_id:
                type: string
                format: uuid
              region_name:
                type: string
              risk_level:
                type: string
                enum: [none, low, medium, high, critical]
              impact_type:
                type: string
                description: Type of impact (check-in delay, transport miss, etc.)
              original_dates:
                type: object
                properties:
                  start:
                    type: string
                    format: date-time
                  end:
                    type: string
                    format: date-time
              suggested_adjustment:
                type: object
                properties:
                  new_start:
                    type: string
                    format: date-time
                  new_end:
                    type: string
                    format: date-time
                  time_shift_minutes:
                    type: integer
              affected_bookings:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [hotel, transport, activity, dining]
                    name:
                      type: string
                    conflict:
                      type: string
              recommendation:
                type: string
        summary:
          type: object
          properties:
            total_regions_affected:
              type: integer
            critical_issues:
              type: integer
            recommended_actions:
              type: array
              items:
                type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
