              schema:
                $ref: '#/components/schemas/DisruptionPropagationResponse'

components:
  schemas:
    # ===== TRIP SCHEMAS =====
    TripCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: "Sri Lanka Adventure 2026"
        description:
          type: string
          maxLength: 1000
        destination:
          type: string
          example: "Sri Lanka"
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        budget:
          type: number
          format: double
        currency:
          type: string
          default: "USD"
        travel_style:
          type: string
          enum: [budget, comfort, luxury]
        dietary_preferences:
          type: array
          items:
            type: string
            enum: [vegetarian, vegan, halal, kosher, gluten_free, no_restrictions]
        accessibility_requirements:
          type: array
          items:
            type: string
        preferences:
          type: object
          additionalProperties: true
      required:
        - title
        - destination
        - start_date
        - end_date
        - budget

    TripUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        budget:
          type: number
          format: double
        travel_style:
          type: string
        dietary_preferences:
          type: array
          items:
            type: string
        accessibility_requirements:
          type: array
          items:
            type: string
        preferences:
          type: object

    TripResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        destination:
          type: string
        status:
          type: string
          enum: [planning, active, completed, cancelled]
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        budget:
          type: number
          format: double
        currency:
          type: string
        travel_style:
          type: string
        dietary_preferences:
          type: array
          items:
            type: string
        accessibility_requirements:
          type: array
          items:
            type: string
        preferences:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid

    TripDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TripResponse'
        - type: object
          properties:
            timeline_summary:
              type: object
              properties:
                total_regions:
                  type: integer
                regions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      start_date:
                        type: string
                        format: date-time
                      end_date:
                        type: string
                        format: date-time

    # ===== REGION NODE SCHEMAS =====
    RegionNodeCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Colombo"
          minLength: 1
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        region_code:
          type: string
          description: ISO region code or internal code
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        notes:
          type: string
      required:
        - name
        - start_date
        - end_date

    RegionNodeUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        notes:
          type: string

    RegionNodeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        region_code:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        state:
          type: string
          enum: [green, red, purple]
          description: Green=OK, Red=Issue, Purple=Completed
        sequence:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegionNodeDetailResponse:
      allOf:
        - $ref: '#/components/schemas/RegionNodeResponse'
        - type: object
          properties:
            transport:
              $ref: '#/components/schemas/TransportSubNodeResponse'
            hotel:
              $ref: '#/components/schemas/HotelSubNodeResponse'
            visitable_locations_summary:
              type: object
              properties:
                possible_count:
                  type: integer
                selected_count:
                  type: integer
            activities_summary:
              type: object
              properties:
                total_available:
                  type: integer
                selected:
                  type: integer
            dining_summary:
              type: object
              properties:
                total_options:
                  type: integer
                reservations:
                  type: integer
            emergency_services_count:
              type: integer
            offers_count:
              type: integer
            cultural_context_available:
              type: boolean
            state_reason:
              type: string
              description: If state is red, reason for the disruption

    # ===== TRANSPORT SUB-NODE SCHEMAS =====
    TransportSubNodeResponse:
      type: object
      properties:
        region_node_id:
          type: string
          format: uuid
        trips:
          type: array
          items:
            $ref: '#/components/schemas/TransportTripResponse'
        summary:
          type: object
          properties:
            total_trips:
              type: integer
            modes_used:
              type: array
              items:
                type: string

    TransportTripCreateRequest:
      type: object
      properties:
        title:
          type: string
          example: "Flight to Colombo"
        mode:
          type: string
          enum: [flight, train, bus, car, tuk-tuk, walking, ferry]
        departure_location:
          type: string
        arrival_location:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        distance_km:
          type: number
        estimated_cost:
          type: number
          format: double
        currency:
          type: string
          default: "USD"
        provider:
          type: string
        booking_reference:
          type: string
        booking_status:
          type: string
          enum: [pending, confirmed, cancelled]
          default: "pending"
        notes:
          type: string
      required:
        - title
        - mode
        - departure_location
        - arrival_location
        - departure_time
        - arrival_time

    TransportTripUpdateRequest:
      type: object
      properties:
        title:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        booking_reference:
          type: string
        booking_status:
          type: string
          enum: [pending, confirmed, cancelled]
        notes:
          type: string

    TransportTripResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        mode:
          type: string
        departure_location:
          type: string
        arrival_location:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        duration_minutes:
          type: integer
        distance_km:
          type: number
        estimated_cost:
          type: number
          format: double
        currency:
          type: string
        provider:
          type: string
        booking_reference:
          type: string
        booking_status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ===== HOTEL SUB-NODE SCHEMAS =====
    HotelSubNodeResponse:
      type: object
      properties:
        region_node_id:
          type: string
          format: uuid
        booked_hotel:
          $ref: '#/components/schemas/HotelBookingResponse'
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        nights:
          type: integer
        available_hotels_count:
          type: integer

    HotelSearchRequest:
      type: object
      properties:
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        guests:
          type: integer
        rooms:
          type: integer
        max_price_per_night:
          type: number
          format: double
        amenities:
          type: array
          items:
            type: string
            enum: [wifi, pool, gym, restaurant, parking, air_conditioning, laundry]
        min_rating:
          type: number
          format: double
          minimum: 0
          maximum: 5

    HotelListing:
      type: object
      properties:
        id:
          type: string
          description: Hotel ID in external system or internal DB
        name:
          type: string
        description:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        rating:
          type: number
          format: double
        review_count:
          type: integer
        price_per_night:
          type: number
          format: double
        currency:
          type: string
        room_types:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              available:
                type: boolean
              price:
                type: number
        amenities:
          type: array
          items:
            type: string
        check_in_time:
          type: string
        check_out_time:
