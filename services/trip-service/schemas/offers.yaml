      enum: [activity, dining, accommodation, transport, shopping, wellness]
    discount_type:
      type: string
      enum: [percentage, fixed_amount, buy_one_get_one, voucher]
    discount_value:
      type: number
      format: double
    original_price:
      type: number
      format: double
    discounted_price:
      type: number
      format: double
    provider:
      type: string
    valid_from:
      type: string
      format: date
    valid_until:
      type: string
      format: date
    terms_and_conditions:
      type: string
    code:
