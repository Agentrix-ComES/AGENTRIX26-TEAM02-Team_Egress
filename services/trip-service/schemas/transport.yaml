TransportSubNodeResponse:
  type: object
  properties:
    region_node_id:
      type: string
      format: uuid
    trips:
      type: array
      items:
        $ref: '#/components/schemas/TransportTripResponse'
    summary:
      type: object
      properties:
        total_trips:
          type: integer
        modes_used:
          type: array
          items:
            type: string

TransportTripCreateRequest:
  type: object
  properties:
    title:
      type: string
      example: "Flight to Colombo"
    mode:
      type: string
      enum: [flight, train, bus, car, tuk-tuk, walking, ferry]
    departure_location:
      type: string
    arrival_location:
      type: string
    departure_time:
      type: string
      format: date-time
    arrival_time:
      type: string
      format: date-time
    duration_minutes:
      type: integer
    distance_km:
      type: number
    estimated_cost:
      type: number
      format: double
    currency:
      type: string
      default: "USD"
    provider:
      type: string
    booking_reference:
      type: string
    booking_status:
      type: string
      enum: [pending, confirmed, cancelled]
      default: "pending"
    notes:
      type: string
  required:
    - title
    - mode
    - departure_location
    - arrival_location
    - departure_time
    - arrival_time

TransportTripUpdateRequest:
  type: object
  properties:
    title:
      type: string
    departure_time:
      type: string
      format: date-time
    arrival_time:
      type: string
      format: date-time
    booking_reference:
      type: string
    booking_status:
      type: string
      enum: [pending, confirmed, cancelled]
    notes:
      type: string

TransportTripResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    mode:
      type: string
    departure_location:
      type: string
    arrival_location:
      type: string
    departure_time:
      type: string
      format: date-time
    arrival_time:
      type: string
      format: date-time
    duration_minutes:
      type: integer
    distance_km:
      type: number
    estimated_cost:
      type: number
      format: double
    currency:
      type: string
    provider:
      type: string
    booking_reference:
      type: string
    booking_status:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
