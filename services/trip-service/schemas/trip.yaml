TripCreateRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 200
      example: "Sri Lanka Adventure 2026"
    description:
      type: string
      maxLength: 1000
    destination:
      type: string
      example: "Sri Lanka"
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    budget:
      type: number
      format: double
    currency:
      type: string
      default: "USD"
    travel_style:
      type: string
      enum: [budget, comfort, luxury]
    dietary_preferences:
      type: array
      items:
        type: string
        enum: [vegetarian, vegan, halal, kosher, gluten_free, no_restrictions]
    accessibility_requirements:
      type: array
      items:
        type: string
    preferences:
      type: object
      additionalProperties: true
  required:
    - title
    - destination
    - start_date
    - end_date
    - budget

TripUpdateRequest:
  type: object
  properties:
    title:
      type: string
    description:
      type: string
    budget:
      type: number
      format: double
    travel_style:
      type: string
    dietary_preferences:
      type: array
      items:
        type: string
    accessibility_requirements:
      type: array
      items:
        type: string
    preferences:
      type: object

TripResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    description:
      type: string
    destination:
      type: string
    status:
      type: string
      enum: [planning, active, completed, cancelled]
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    budget:
      type: number
      format: double
    currency:
      type: string
    travel_style:
      type: string
    dietary_preferences:
      type: array
      items:
        type: string
    accessibility_requirements:
      type: array
      items:
        type: string
    preferences:
      type: object
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    user_id:
      type: string
      format: uuid

TripDetailResponse:
  allOf:
    - $ref: '#/components/schemas/TripResponse'
    - type: object
      properties:
        timeline_summary:
          type: object
          properties:
            total_regions:
              type: integer
            regions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  start_date:
                    type: string
                    format: date-time
                  end_date:
                    type: string
                    format: date-time
