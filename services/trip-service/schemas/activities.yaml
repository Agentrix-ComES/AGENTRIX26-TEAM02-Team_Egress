    estimated_cost:
      type: number
      format: double
    age_requirements:
      type: object
    physical_requirements:
      type: string
    location:
      type: string
    operating_hours:
      type: string
    best_season:
      type: string
    required_equipment:
      type: array
      items:
        type: string
    instructor_available:
      type: boolean
    group_size_limit:
      type: integer
    images:
      type: array
      items:
        type: string
        format: uri
    provider:
      type: string
