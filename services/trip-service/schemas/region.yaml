RegionNodeCreateRequest:
  type: object
  properties:
    name:
      type: string
      example: "Colombo"
      minLength: 1
    description:
      type: string
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    region_code:
      type: string
      description: ISO region code or internal code
    latitude:
      type: number
      format: double
    longitude:
      type: number
      format: double
    notes:
      type: string
  required:
    - name
    - start_date
    - end_date

RegionNodeUpdateRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    notes:
      type: string

RegionNodeResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    trip_id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    region_code:
      type: string
    latitude:
      type: number
      format: double
    longitude:
      type: number
      format: double
    state:
      type: string
      enum: [green, red, purple]
      description: Green=OK, Red=Issue, Purple=Completed
    sequence:
      type: integer
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

RegionNodeDetailResponse:
  allOf:
    - $ref: '#/components/schemas/RegionNodeResponse'
    - type: object
      properties:
        transport:
          $ref: '#/components/schemas/TransportSubNodeResponse'
        hotel:
          $ref: '#/components/schemas/HotelSubNodeResponse'
        visitable_locations_summary:
          type: object
          properties:
            possible_count:
              type: integer
            selected_count:
              type: integer
        activities_summary:
          type: object
          properties:
            total_available:
              type: integer
            selected:
              type: integer
        dining_summary:
          type: object
          properties:
            total_options:
              type: integer
            reservations:
              type: integer
        emergency_services_count:
          type: integer
        offers_count:
          type: integer
        cultural_context_available:
          type: boolean
        state_reason:
          type: string
          description: If state is red, reason for the disruption
