openapi: 3.0.0
info:
  title: Trip Service API
  description: |
    AI-Powered Timeline Travel Planning and Assistance Platform
    
    The Trip Service is the central hub for managing the complete travel timeline experience.
    It operates on a hierarchical node structure where top-level nodes represent regions 
    (cities/towns like "Colombo") that expand into rich sub-nodes covering all aspects 
    of travel in that region.
    
    **Core Model**: Region Nodes with 9 Sub-Node Categories
    - Transport: Multiple trip entries to/from the region
    - Hotel: Available hotels, bookings, and occupancy
    - Possible Visitable Locations: Browse all attractions; AI recommendations
    - Selected Visitable Locations: Attractions user plans to visit (auto-populated from transport or manual)
    - Activities: Regional experiences; typically admin/external-API managed
    - Food & Dining: Restaurants, cafes, local food shops
    - Emergency Services: Hospitals, emergency contacts, medical facilities
    - Offers & Discounts: Regional promotions and deals
    - Cultural Context: Regional cultural info + dynamic tips for selected locations
    
    **Data Flow**: All enrichment (hotel availability, recommendations, cultural notes) 
    flows through Trip Service before reaching users. External data integrations happen 
    at the service layer, not at API boundaries.
    
    **Note**: Trip Service handles persistence and orchestration. Recommendation engines, 
    routing optimization, and disruption propagation are delegated to specialized agents 
    that call these APIs and perform business logic.
  version: 2.0.0
  contact:
    name: Team Egress
    email: team-egress@travel-platform.local

servers:
  - url: http://localhost:8002/api/v1
    description: Local development
  - url: https://api.travel-platform.local/trip-service/v1
    description: Production

tags:
  - name: Trips
    description: Trip creation, retrieval, and management
  - name: Region Nodes
    description: Top-level region nodes (cities/towns) in the timeline
  - name: Transport Sub-Node
    description: Transport trips to/from regions (flights, trains, buses, etc.)
  - name: Hotel Sub-Node
    description: Hotel search, booking, and occupancy for regions
  - name: Visitable Locations
    description: Browse possible attractions and manage selected locations
  - name: Activities Sub-Node
    description: Regional activities and experiences
  - name: Food & Dining Sub-Node
    description: Restaurants, cafes, and dining reservations
  - name: Emergency Services Sub-Node
    description: Hospitals, medical facilities, and emergency contacts
  - name: Offers & Discounts Sub-Node
    description: Regional promotions and discounts
  - name: Cultural Context Sub-Node
    description: Regional cultural guidance and location-specific etiquette
  - name: Trip Alerts
    description: Disruptions, delays, and alerts affecting trips

