# ===== ALERTS =====
/trips/{trip_id}/alerts:
  post:
    tags:
      - Trip Alerts
    summary: Report a disruption affecting the trip
    operationId: create_alert
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TripAlertCreateRequest'
    responses:
      '201':
        description: Alert created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripAlertResponse'

  get:
    tags:
      - Trip Alerts
    summary: List alerts for the trip
    operationId: list_alerts
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum: [active, resolved, acknowledged]
    responses:
      '200':
        description: List of alerts
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TripAlertResponse'

/trips/{trip_id}/alerts/{alert_id}:
  get:
    tags:
      - Trip Alerts
    summary: Get alert details
    operationId: get_alert
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Alert details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripAlertDetailedResponse'

  patch:
    tags:
      - Trip Alerts
    summary: Update alert status
    operationId: update_alert_status
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [active, resolved, acknowledged]
            required:
              - status
    responses:
      '200':
        description: Alert updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripAlertResponse'

/trips/{trip_id}/alerts/{alert_id}/propagate:
  post:
    tags:
      - Trip Alerts
    summary: Analyze disruption propagation effects
    operationId: propagate_disruption
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              affected_region_id:
                type: string
                format: uuid
              estimated_delay_minutes:
                type: integer
            required:
              - affected_region_id
              - estimated_delay_minutes
    responses:
      '200':
        description: Propagation analysis
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisruptionPropagationResponse'
