# ===== VISITABLE LOCATIONS =====
/trips/{trip_id}/timeline/regions/{region_node_id}/locations/possible:
  get:
    tags:
      - Visitable Locations
    summary: Get all possible visitable locations (attractions) in the region
    operationId: get_possible_locations
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        schema:
          type: string
          enum: [cultural, historical, adventure, relaxation, food, nature, religious]
      - name: skip
        in: query
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
    responses:
      '200':
        description: List of possible locations
        content:
          application/json:
            schema:
              type: object
              properties:
                locations:
                  type: array
                  items:
                    $ref: '#/components/schemas/VisitableLocationResponse'
                recommendations:
                  type: array
                  items:
                    type: object
                    properties:
                      location_id:
                        type: string
                      match_score:
                        type: number
                        format: double
                        description: 0-1 score based on user preferences

  post:
    tags:
      - Visitable Locations
    summary: Create a new visitable location in the region (admin)
    operationId: create_visitable_location
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VisitableLocationCreateRequest'
    responses:
      '201':
        description: Location created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitableLocationResponse'

/trips/{trip_id}/timeline/regions/{region_node_id}/locations/possible/{location_id}:
  patch:
    tags:
      - Visitable Locations
    summary: Update a visitable location (admin)
    operationId: update_visitable_location
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: location_id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VisitableLocationUpdateRequest'
    responses:
      '200':
        description: Location updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitableLocationResponse'

  delete:
    tags:
      - Visitable Locations
    summary: Delete a visitable location (admin)
    operationId: delete_visitable_location
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: location_id
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Location deleted

/trips/{trip_id}/timeline/regions/{region_node_id}/locations/selected:
  get:
    tags:
      - Visitable Locations
    summary: Get selected (planned) visitable locations for the region
    operationId: get_selected_locations
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: List of selected locations
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SelectedLocationResponse'

  post:
    tags:
      - Visitable Locations
    summary: Add a location to selected locations
    operationId: add_selected_location
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              location_id:
                type: string
                description: ID of location to add
              visit_date:
                type: string
                format: date
              visit_time:
                type: string
                description: Preferred visit time (e.g., morning, afternoon)
            required:
              - location_id
    responses:
      '201':
        description: Location added to selected
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectedLocationResponse'

/trips/{trip_id}/timeline/regions/{region_node_id}/locations/selected/{location_id}:
  delete:
    tags:
      - Visitable Locations
    summary: Remove a location from selected locations
    operationId: remove_selected_location
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: location_id
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Location removed

