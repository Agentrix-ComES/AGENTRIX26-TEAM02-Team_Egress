/trips/{trip_id}/timeline/regions/{region_node_id}/hotel/search:
  post:
    tags:
      - Hotel Sub-Node
    summary: Search for available hotels in the region
    operationId: search_hotels
    parameters:
      - name: trip_id
        in: path
        required: true
