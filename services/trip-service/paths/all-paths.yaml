# ===== REGION NODES =====
/trips/{trip_id}/timeline/regions:
  post:
    tags:
      - Region Nodes
    summary: Add a region (city/town) to the trip timeline
    operationId: create_region_node
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegionNodeCreateRequest'
    responses:
      '201':
        description: Region node created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionNodeResponse'
      '400':
        description: Invalid region data

/trips/{trip_id}/timeline/regions/{region_node_id}:
  get:
    tags:
      - Region Nodes
    summary: Get a region node with all sub-node summaries
    operationId: get_region_node
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Region node with all sub-nodes
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionNodeDetailResponse'

  patch:
    tags:
      - Region Nodes
    summary: Update region node metadata (dates, notes)
    operationId: update_region_node
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegionNodeUpdateRequest'
    responses:
      '200':
        description: Region node updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionNodeResponse'

  delete:
    tags:
      - Region Nodes
    summary: Delete a region from the timeline
    operationId: delete_region_node
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: region_node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Region deleted

