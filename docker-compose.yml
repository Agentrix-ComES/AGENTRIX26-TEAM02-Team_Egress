name: travel-platform

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-travel_platform}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-net

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD required}",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: travel-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
      QDRANT__SERVICE__GRPC_PORT: "6334"
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-net

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: travel-user-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-travel_platform}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    networks:
      - travel-net

  trip-service:
    build:
      context: ./services/trip-service
      dockerfile: Dockerfile
    container_name: travel-trip-service
    restart: unless-stopped
    ports:
      - "${TRIP_SERVICE_PORT:-8003}:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-travel_platform}
      - DB_ECHO=false
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-super-secret-dev-jwt-secret-change-me}
      - AUTH_DISABLED=${TRIP_SERVICE_AUTH_DISABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel-net

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: travel-booking-service
    restart: unless-stopped
    ports:
      - "${BOOKING_SERVICE_PORT:-8004}:8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-travel_platform}
      - DB_ECHO=false
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-super-secret-dev-jwt-secret-change-me}
      - AUTH_DISABLED=${BOOKING_SERVICE_AUTH_DISABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel-net

  destination-service:
    build:
      context: ./services/destination-service
      dockerfile: Dockerfile
    container_name: travel-destination-service
    restart: unless-stopped
    ports:
      - "${DESTINATION_SERVICE_PORT:-8005}:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-travel_platform}
      - DB_ECHO=false
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-super-secret-dev-jwt-secret-change-me}
      - AUTH_DISABLED=${DESTINATION_SERVICE_AUTH_DISABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel-net

  neo4j:
    image: neo4j:5-community
    container_name: travel-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - travel-net


  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: travel-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - travel-net

  kong:
    image: kong:3.6
    container_name: travel-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
    ports:
      - "${KONG_PROXY_PORT:-8080}:8000"
      - "8443:8443"
    volumes:
      - ./infra/gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    depends_on:
      - ai-service
      - user-service
    networks:
      - travel-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    image: travel-platform/client:latest
    container_name: travel-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - travel-net

  client-dev:
    image: node:22-alpine
    container_name: travel-client-dev
    profiles: ["dev"]
    working_dir: /app
    environment:
      - VITE_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${CLIENT_DEV_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    networks:
      - travel-net

networks:
  travel-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  client_node_modules:
